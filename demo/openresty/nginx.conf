worker_processes 1;

env S390X_DEMO_TRACE_OBSERVER;

error_log logs/error.log notice;
pid logs/nginx.pid;

events {
  worker_connections 1024;
}

http {
  lua_package_path "$prefix/lua/?.lua;;";
  lua_shared_dict jit_metrics 1m;

  init_by_lua_block {
    require("jit_metrics").init()
    require("policy")
  }

  init_worker_by_lua_block {
    require("jit_metrics").start_trace_listener()
  }

  server {
    listen 127.0.0.1:8080;
    server_name gateway.demo;

    access_log logs/gateway.access.log;
    location = /payments/authorize {
      content_by_lua_block {
        require("policy").handle_gateway_request("jit")
      }
    }

    location = /payments/authorize_interp {
      content_by_lua_block {
        require("policy").handle_gateway_request("interp")
      }
    }

    location = /__jit {
      default_type application/json;
      content_by_lua_block {
        require("jit_metrics").respond()
      }
    }

    location = /__demo {
      default_type text/plain;
      content_by_lua_block {
        ngx.say(require("policy").demo_summary())
      }
    }

    location = /__approve_dispatch {
      internal;
      add_header X-Decision $http_x_decision always;
      add_header X-Risk-Score $http_x_risk_score always;
      add_header X-Arch s390x always;
      add_header X-LuaJIT $http_x_luajit always;
      add_header X-Policy-Mode $http_x_policy_mode always;
      proxy_set_header X-Decision $http_x_decision;
      proxy_set_header X-Risk-Score $http_x_risk_score;
      proxy_set_header X-Policy-Mode $http_x_policy_mode;
      proxy_set_header X-LuaJIT $http_x_luajit;
      proxy_pass http://127.0.0.1:18081/approve;
    }

    location = /__review_dispatch {
      internal;
      add_header X-Decision $http_x_decision always;
      add_header X-Risk-Score $http_x_risk_score always;
      add_header X-Arch s390x always;
      add_header X-LuaJIT $http_x_luajit always;
      add_header X-Policy-Mode $http_x_policy_mode always;
      proxy_set_header X-Decision $http_x_decision;
      proxy_set_header X-Risk-Score $http_x_risk_score;
      proxy_set_header X-Policy-Mode $http_x_policy_mode;
      proxy_set_header X-LuaJIT $http_x_luajit;
      proxy_pass http://127.0.0.1:18082/review;
    }
  }

  server {
    listen 127.0.0.1:18081;
    server_name approve.demo;
    access_log off;

    location = /approve {
      default_type application/json;
      content_by_lua_block {
        local decision = ngx.var.http_x_decision or "approve"
        local score = ngx.var.http_x_risk_score or "0"
        ngx.say('{"decision":"', decision, '","risk_score":', score, ',"backend":"approve"}')
      }
    }
  }

  server {
    listen 127.0.0.1:18082;
    server_name review.demo;
    access_log off;

    location = /review {
      default_type application/json;
      content_by_lua_block {
        local decision = ngx.var.http_x_decision or "review"
        local score = ngx.var.http_x_risk_score or "0"
        ngx.say('{"decision":"', decision, '","risk_score":', score, ',"backend":"review"}')
      }
    }
  }
}
